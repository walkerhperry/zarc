<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<style>
  :root{
    --paper:#efe6d4; --ink:#231a10; --muted:#7b6a55; --line:rgba(58,40,22,.14); --card:#fbf6ec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#191108; --ink:#f2e8d6; --muted:#a2907a; --line:rgba(242,232,214,.14); --card:#211809; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  main{width:min(560px,86vw);text-align:left}
  h1{font-family:Iowan Old Style,Georgia,"Times New Roman",serif;font-weight:400;font-size:40px;margin:0 0 6px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
  kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:inherit;font-size:12.5px;background:var(--card)}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  a{display:block;padding:13px 14px;border:1px solid var(--line);border-radius:11px;color:inherit;
    text-decoration:none;font-size:13.5px}
  a:hover{border-color:currentColor}
  a span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>Where to?</h1>
  <p>Press <kbd>⌘L</kbd> to search or type an address. Rest on any link and press <kbd>G</kbd> to glance at it without opening a tab.</p>
  <div class="links">
    <a href="https://en.wikipedia.org">Wikipedia<span>en.wikipedia.org</span></a>
    <a href="https://news.ycombinator.com">Hacker News<span>news.ycombinator.com</span></a>
    <a href="https://developer.mozilla.org/en-US/">MDN<span>developer.mozilla.org</span></a>
    <a href="https://github.com">GitHub<span>github.com</span></a>
  </div>
</main>
</body>
</html>
